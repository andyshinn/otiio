[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "otiio"
dynamic = ["version"]
description = "Read Otii 3 project files (.otii3) with numpy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andy Shinn", email = "andy.shinn@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
keywords = ["otii", "qoitech", "power", "energy", "measurement", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2", "pyarrow>=16"]

[project.urls]
Homepage = "https://github.com/andyshinn/otiio"
Issues = "https://github.com/andyshinn/otiio/issues"

[dependency-groups]
dev = ["mypy>=1.13", "pandas-stubs>=2.2", "pytest>=8", "ruff>=0.8"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.sdist]
exclude = ["/examples", "/tests/data"]

[tool.hatch.build.targets.wheel]
packages = ["src/otiio"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["examples: tests that need the large projects in examples/ (skipped when absent)"]
